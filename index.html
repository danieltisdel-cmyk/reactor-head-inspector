<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reactor Head Inspector</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header>
    <h1>🔍 Reactor Head Inspector</h1>
    <div class="header-controls">
      <select id="headSelect" class="select"></select>
      <button id="newHeadBtn" class="btn btn-primary">+ New Head</button>
      <button id="saveBtn" class="btn">💾 Save</button>
      <button id="loadBtn" class="btn">📂 Load</button>
      <button id="resetBtn" class="btn btn-danger">↺ Reset</button>
        <div class="penetration-controls">
          <button id="addPenetrationBtn" class="btn">+ Pen</button>
          <button id="movePenetrationBtn" class="btn">⇄ Move Pen</button>
          <button id="deletePenetrationBtn" class="btn">- Pen</button>
      </div>
    </div>
  </header>

  <main>
    <div class="left-panel">
      <div class="head-info">
        <h2 id="headName">—</h2>
        <div class="info-grid">
          <div class="info-item">
            <span class="label">Penetrations:</span>
            <span id="headPenetrations">0</span>
          </div>
          <div class="info-item">
            <span class="label">Layout:</span>
            <select id="layoutSelect" class="select">
              <option value="octagonal">Octagonal</option>
              <option value="circular">Circular</option>
              <option value="square">Square</option>
              <option value="hexagonal">Hexagonal</option>
            </select>
          </div>
          <div class="info-item">
            <span class="label">Rows:</span>
            <input type="number" id="rowsInput" class="input" min="1" max="20" value="8">
          </div>
        </div>
      </div>

      <div class="progress-section">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <div class="progress-text">
          <span id="progressPercent">0%</span>
          <span id="progressDetail">0 / 0 quadrants</span>
        </div>
      </div>

      <div class="row-selector">
        <label for="rowSelect">Nano Mag Crawler Row:</label>
        <div class="row-controls">
          <button id="prevRowBtn" class="btn">◀</button>
          <span id="currentRow">1</span>
          <button id="nextRowBtn" class="btn">▶</button>
          <input type="number" id="rowJumpInput" class="input" min="1" max="20" value="1" style="width:60px">
          <button id="rowJumpBtn" class="btn">Go</button>
        </div>
      </div>

      <div class="quadrant-legend">
        <h3>Quadrant Legend</h3>
        <div class="legend-items">
          <div class="legend-item"><span class="dot dot-green"></span> Inspected</div>
          <div class="legend-item"><span class="dot dot-yellow"></span> In Progress</div>
          <div class="legend-item"><span class="dot dot-red"></span> Pending</div>
          <div class="legend-item"><span class="dot dot-blue"></span> Needs Attention</div>
        </div>
      </div>
    </div>

    <div class="center-panel">
      <div id="reactorHead" class="reactor-head"></div>
      <div class="quadrant-info">
        <h3>Quadrant Details</h3>
        <div id="quadrantDetails" class="quadrant-details"></div>
      </div>
    </div>

    <div class="right-panel">
      <div class="penetration-list">
        <h3>Penetration Grid</h3>
        <div id="penetrationGrid" class="penetration-grid"></div>
      </div>
      <div class="export-section">
        <h3>Export</h3>
        <div class="export-buttons">
          <button id="exportJsonBtn" class="btn">📄 JSON</button>
          <button id="exportCsvBtn" class="btn">📊 CSV</button>
          <button id="printBtn" class="btn">🖨️ Print</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <span id="statusMsg">Ready</span>
    <span id="lastSaved">—</span>
  </footer>
</div>

<script src="inspector.js"></script>
</body>
</html>
